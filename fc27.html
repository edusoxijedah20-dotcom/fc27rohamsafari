<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC27 Download Link</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d12;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #111a22;
            border: 1px solid #263746;
            border-radius: 20px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 0 40px #00e67612;
        }

        .logo {
            font-size: 52px;
            font-weight: bold;
            color: #00e676;
            letter-spacing: 3px;
            direction: ltr;
        }

        .check {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #00e67618;
            color: #00e676;
            font-size: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }

        h2 {
            font-size: 21px;
            margin-bottom: 12px;
        }

        .description {
            color: #91a1ad;
            font-size: 13px;
            line-height: 2;
        }

        .link-box {
            direction: ltr;
            background: #080d12;
            border: 1px solid #263746;
            border-radius: 10px;
            padding: 15px;
            margin: 25px 0 15px;
            color: #00e676;
            font-size: 13px;
            overflow-wrap: anywhere;
            text-align: left;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #00c853;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #00e676;
            transform: translateY(-2px);
        }

        .message {
            color: #00e676;
            font-size: 12px;
            min-height: 20px;
            margin-top: 12px;
        }

        .footer {
            color: #53616b;
            font-size: 10px;
            margin-top: 25px;
            direction: ltr;
        }

        .badge {
            display: inline-block;
            background: #00e67615;
            color: #00e676;
            border: 1px solid #00e67630;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">FC 27</div>

        <div class="check">✓</div>

        <h2>لینک FC27 برای شما ساخته شد!</h2>

        <p class="description">
            فرایند ساخت لینک با موفقیت به پایان رسید.<br>
            لینک دانلود آزمایشی شما آماده است.
        </p>

        <div class="badge">LINK GENERATED SUCCESSFULLY</div>

        <div class="link-box" id="downloadLink">
            https://fc27-download.example/download/FC27
        </div>

        <button onclick="copyLink()">کپی لینک دانلود</button>

        <div class="message" id="message"></div>

        <div class="footer">
            FC27 DOWNLOAD SYSTEM © 2026
            <br><br>
            DEMO PAGE — NOT A REAL DOWNLOAD
        </div>

    </div>

    <script>
        function copyLink() {
            const link = document.getElementById("downloadLink").innerText;

            navigator.clipboard.writeText(link).then(() => {
                document.getElementById("message").innerText = "لینک با موفقیت کپی شد!";
            }).catch(() => {
                document.getElementById("message").innerText = "کپی خودکار در این مرورگر پشتیبانی نمی‌شود.";
            });
        }
    </script>

</body>
</html>
